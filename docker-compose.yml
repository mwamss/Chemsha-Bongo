version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: chemsha_bongo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chemsha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chemsha_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-chemsha_bongo_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seeds:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chemsha_user} -d ${POSTGRES_DB:-chemsha_bongo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
    name: chemsha_bongo_postgres_data
